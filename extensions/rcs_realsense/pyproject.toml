[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rcs_realsense"
version = "0.7.2"
description = "RCS realsense module"
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = [
  "rcs-core>=0.7.2",
  # 2.55.1 removed L515 support. The lab's third-person camera is an L515,
  # so keep the last Python 3.11-compatible SDK release that still supports it.
  "pyrealsense2>=2.54.2,<2.55.1",
  "pupil_apriltags",
  "diskcache",
]
maintainers = [{ name = "Tobias Juelg", email = "tobias.juelg@utn.de" }]
authors = [{ name = "Tobias Juelg", email = "tobias.juelg@utn.de" }]
requires-python = ">=3.11"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
